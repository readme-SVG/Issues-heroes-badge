<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Validator Checker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 24px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            box-sizing: border-box;
            font-family: monospace;
        }
        button {
            background-color: #238636;
            color: #ffffff;
            border: 1px solid rgba(240, 246, 252, 0.1);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background-color: #2ea043;
        }
        button:disabled {
            background-color: #1b4b23;
            color: #8b949e;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            white-space: pre-wrap;
            font-family: monospace;
            line-height: 1.5;
        }
        .valid { background-color: rgba(46, 160, 67, 0.15); border: 1px solid #2ea043; color: #3fb950; }
        .invalid { background-color: rgba(248, 81, 73, 0.1); border: 1px solid #f85149; color: #ff7b72; }
        .suspicious { background-color: rgba(210, 153, 34, 0.15); border: 1px solid #d29922; color: #e3b341; }
    </style>
</head>
<body>

<div class="container">
    <h2>Issue Format Checker</h2>
    <p>Введите заголовок Issue для локальной проверки:</p>
    <input type="text" id="issueInput" placeholder="<HeroeName|Username|#FF0000>" autocomplete="off">
    <button id="checkBtn" onclick="checkIssue()">Проверить</button>

    <div id="resultBox" class="result"></div>
</div>

<script>
    // Настройки репозитория
    const REPO_OWNER = 'readme-SVG';
    const REPO_NAME = 'Issues-heroes-badge';
    const BRANCH = 'main'; // Или укажите нужную ветку

    function matchPattern(pattern, str) {
        if (pattern.includes('&&')) {
            const parts = pattern.split('&&').map(p => p.trim()).filter(Boolean);
            return parts.every(p => matchPattern(p, str));
        }

        if (pattern.includes('*') || pattern.includes('+')) {
            const reStr = pattern
                .replace(/[.^${}()|[\]\\]/g, '\\$&')
                .replace(/\*/g, '[\\s\\S]*')
                .replace(/\+/g, '[^\\s]+');

            const startsWild = pattern[0] === '*' || pattern[0] === '+';
            const endsWild   = pattern[pattern.length - 1] === '*' || pattern[pattern.length - 1] === '+';

            let re;
            if (startsWild || endsWild) {
                try { re = new RegExp(reStr, 'i'); } catch { return false; }
                return re.test(str);
            } else {
                try { re = new RegExp('^' + reStr + '$', 'i'); } catch { return false; }
                return re.test(str);
            }
        }
        return str === pattern;
    }

    async function checkIssue() {
        const title = document.getElementById('issueInput').value.trim();
        const btn = document.getElementById('checkBtn');
        const resBox = document.getElementById('resultBox');
        
        if (!title) return;

        btn.disabled = true;
        btn.textContent = 'Проверка...';
        resBox.style.display = 'none';
        resBox.className = 'result';
        resBox.innerHTML = '';

        let errors = [];
        const MAX_LEN = 60;
        
        if (title.length > MAX_LEN) {
            errors.push(`Issue title is too long (${title.length} chars). Maximum allowed: ${MAX_LEN}.`);
        }

        const RE = /^<\s*HeroeName\s*\|\s*([a-zA-Z\u0400-\u04FF0-9_ .!,?:;'-]{1,40})\s*(?:\|\s*(#[0-9a-fA-F]{3,6})\s*)?\s*>$/i;
        const match = title.length <= MAX_LEN ? title.match(RE) : null;

        let heroName = '';

        if (!match) {
            if (title.length <= MAX_LEN) {
                errors.push('The content must be exactly `<HeroeName|Username>` or `<HeroeName|Username|#RRGGBB>` with no extra text.');
            }
        } else {
            heroName = match[1].trim();
            const color = match[2];

            if (!heroName || heroName.length === 0) {
                errors.push('Username cannot be empty.');
            }
            if (heroName.length > 40) {
                errors.push(`Username is too long (${heroName.length} chars). Maximum: 40.`);
            }
            if (/[^a-zA-Z\u0400-\u04FF0-9_ .!,?:;'-]/.test(heroName)) {
                errors.push('Username contains invalid characters. Only letters (latin/cyrillic), numbers, spaces, underscores, hyphens, and punctuation (. ! , ? : ; \') are allowed.');
            }

            if (color !== undefined) {
                if (!/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(color)) {
                    errors.push(`Color \`${color}\` is not valid. Use \`#RGB\` or \`#RRGGBB\` (e.g. \`#FF0000\`).`);
                }
            }
        }

        if (errors.length > 0) {
            showResult('invalid', '[Invalid]\n\n' + errors.join('\n- '));
            resetBtn();
            return;
        }

        // Если формат валиден, проверяем на Suspicious через GitHub API
        try {
            const treeUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${BRANCH}?recursive=1`;
            const treeRes = await fetch(treeUrl);
            
            if (!treeRes.ok) {
                throw new Error(`Failed to fetch repository tree: ${treeRes.status}`);
            }

            const treeData = await treeRes.json();
            const txtFiles = (treeData.tree || []).filter(f => f.type === 'blob' && f.path.startsWith('banned-words/') && f.path.endsWith('.txt'));

            let suspiciousMatchInfo = null;
            const inputLower = heroName.toLowerCase();

            for (const fileObj of txtFiles) {
                const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${fileObj.path}`;
                const fileRes = await fetch(rawUrl);
                
                if (fileRes.ok) {
                    const content = await fileRes.text();
                    const localPatterns = content.split('\n').map(l => l.trim().toLowerCase()).filter(Boolean);
                    
                    const suspiciousMatch = localPatterns.find(p => matchPattern(p, inputLower));
                    
                    if (suspiciousMatch) {
                        suspiciousMatchInfo = {
                            file: fileObj.path,
                            pattern: suspiciousMatch
                        };
                        break;
                    }
                }
            }

            if (suspiciousMatchInfo) {
                showResult('suspicious', `[Suspicious]\n\nUsername matched a pattern in local dictionaries.\nFile: ${suspiciousMatchInfo.file}\nPattern: ${suspiciousMatchInfo.pattern}`);
            } else {
                showResult('valid', '[Valid]\n\nValidation passed! Your username format is correct and no banned words were detected.');
            }

        } catch (e) {
            showResult('invalid', `[Error]\n\nFailed to check banned words: ${e.message}`);
        }

        resetBtn();

        function showResult(type, text) {
            resBox.className = `result ${type}`;
            resBox.textContent = text;
            resBox.style.display = 'block';
        }

        function resetBtn() {
            btn.disabled = false;
            btn.textContent = 'Проверить';
        }
    }
</script>

</body>
</html>
