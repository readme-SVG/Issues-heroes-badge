<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Issue Validator</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #0d1117;
            color: #c9d1d9;
            max-width: 800px;
            margin: 0 auto;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #161b22;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #2ea043; }
        #result { margin-top: 20px; white-space: pre-wrap; line-height: 1.5; }
        .error { color: #f85149; }
        .success { color: #3fb950; }
        .warning { color: #d29922; }
    </style>
</head>
<body>
    <h2>Валидатор записей Heroes Badge</h2>
    <p>Введите заголовок Issue</p>
    
    <input type="text" id="issueInput" placeholder="<HeroeName|Username|#Hex>">
    <button onclick="validate()" id="checkBtn">Проверить</button>
    
    <div id="result">Ожидание ввода...</div>

    <script>
        const OWNER = 'readme-SVG';
        const REPO = 'Issues-heroes-badge';
        const BRANCH = 'main';
        
        let bannedWordsCache = {};
        let isCacheLoaded = false;

        async function loadBannedWords() {
            if (isCacheLoaded) return bannedWordsCache;
            
            try {
                const treeUrl = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
                const treeRes = await fetch(treeUrl);
                
                if (!treeRes.ok) throw new Error(`Ошибка API: ${treeRes.status}`);
                
                const treeData = await treeRes.json();
                const txtFiles = (treeData.tree || []).filter(f => 
                    f.type === 'blob' && 
                    f.path.startsWith('banned-words/') && 
                    f.path.endsWith('.txt')
                );
                
                const fetchPromises = txtFiles.map(async (file) => {
                    const rawUrl = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${file.path}`;
                    const res = await fetch(rawUrl);
                    if (res.ok) {
                        const content = await res.text();
                        const patterns = content.split('\n')
                            .map(l => l.trim().toLowerCase())
                            .filter(Boolean);
                        bannedWordsCache[file.path] = patterns;
                    }
                });

                await Promise.all(fetchPromises);
                isCacheLoaded = true;
            } catch (err) {
                console.error('Ошибка загрузки списков слов:', err);
                throw err;
            }
            return bannedWordsCache;
        }

        function matchPattern(pattern, str) {
            if (pattern.includes('&&')) {
                const parts = pattern.split('&&').map(p => p.trim()).filter(Boolean);
                return parts.every(p => matchPattern(p, str));
            }

            if (pattern.includes('*') || pattern.includes('+')) {
                const reStr = pattern
                    .replace(/[.^${}()|[\]\\]/g, '\\$&')
                    .replace(/\*/g, '[\\s\\S]*')
                    .replace(/\+/g, '[^\\s]+');

                const startsWild = pattern[0] === '*' || pattern[0] === '+';
                const endsWild = pattern[pattern.length - 1] === '*' || pattern[pattern.length - 1] === '+';

                let re;
                if (startsWild || endsWild) {
                    try { re = new RegExp(reStr, 'i'); } catch { return false; }
                    return re.test(str);
                } else {
                    try { re = new RegExp('^' + reStr + '$', 'i'); } catch { return false; }
                    return re.test(str);
                }
            }
            return str === pattern;
        }

        async function validate() {
            const input = document.getElementById('issueInput').value.trim();
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('checkBtn');
            
            if (!input) {
                resultDiv.innerText = 'Поле ввода пустое.';
                resultDiv.className = 'error';
                return;
            }

            resultDiv.innerText = 'Загрузка словарей и проверка...';
            resultDiv.className = 'warning';
            btn.disabled = true;

            let errors = [];
            const MAX_LEN = 60;

            if (input.length > MAX_LEN) {
                errors.push(`Длина заголовка превышает допустимую (${input.length} > ${MAX_LEN}).`);
            }

            const RE = /^<\s*HeroeName\s*\|\s*([a-zA-Z\u0400-\u04FF0-9_ .!,?:;'-]{1,40})\s*(?:\|\s*(#[0-9a-fA-F]{3,6})\s*)?\s*>$/i;
            const match = input.length <= MAX_LEN ? input.match(RE) : null;

            if (!match) {
                if (input.length <= MAX_LEN) {
                    errors.push('Формат должен строго соответствовать <HeroeName|Username> или <HeroeName|Username|#RRGGBB>. Убедитесь в отсутствии лишних символов.');
                }
            } else {
                const heroName = match[1].trim();
                const color = match[2];

                if (!heroName) errors.push('Username не может быть пустым.');
                if (heroName.length > 40) errors.push(`Username слишком длинный (${heroName.length} > 40).`);
                if (/[^a-zA-Z\u0400-\u04FF0-9_ .!,?:;'-]/.test(heroName)) {
                    errors.push('Username содержит недопустимые символы.');
                }

                if (color !== undefined) {
                    if (!/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(color)) {
                        errors.push(`Цвет \`${color}\` не валиден. Используйте формат #RGB или #RRGGBB.`);
                    }
                }

                try {
                    const dicts = await loadBannedWords();
                    const inputLower = heroName.toLowerCase();
                    
                    for (const [filePath, patterns] of Object.entries(dicts)) {
                        const foundPattern = patterns.find(p => matchPattern(p, inputLower));
                        if (foundPattern) {
                            errors.push(`Username содержит запрещенное слово. Совпадение найдено в файле: ${filePath} (паттерн: "${foundPattern}")`);
                        }
                    }
                } catch (e) {
                    errors.push('Не удалось загрузить списки запрещенных слов для проверки.');
                }
            }

            if (errors.length === 0) {
                resultDiv.innerText = 'Валидация пройдена. Запись корректна.';
                resultDiv.className = 'success';
            } else {
                resultDiv.innerText = 'Валидация не пройдена. Ошибки:\n\n- ' + errors.join('\n- ');
                resultDiv.className = 'error';
            }
            
            btn.disabled = false;
        }
    </script>
</body>
</html>
