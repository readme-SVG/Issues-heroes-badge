name: Issue Validator

on:
  issues:
    types: [opened, edited]

permissions: read-all

concurrency:
  group: validate-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate issue format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate title and apply labels
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const MAX_TITLE_LENGTH = 60;
            const MAX_NAME_LENGTH = 40;
            const MAX_LABELLED_ISSUES = 2;
            const DICTIONARY_DIRECTORY = 'banned-words';
            const DICTIONARY_EXTENSION = '.txt';

            const TITLE_RE = new RegExp(
              "^<\\s*HeroeName\\s*\\|\\s*([a-zA-Z\\u0400-\\u04FF0-9_ .!,?:;'-]{1,40})\\s*" +
                "(?:\\|\\s*(#[0-9a-fA-F]{3}|#[0-9a-fA-F]{6})\\s*)?>\\s*$",
              'i'
            );

            const LABELS = [
              { name: 'Valid', color: '0E8A16', description: 'Issue title passed validation' },
              { name: 'Invalid', color: 'D93F0B', description: 'Issue title failed validation' },
              { name: 'Suspicious', color: 'FBCA04', description: 'Matched a local dictionary entry' },
              { name: 'Stopped', color: '1E90FF', description: 'Replaced by a newer submission' },
            ];

            // --- pattern engine -------------------------------------------------
            // Wildcard rules are matched with a dynamic-programming table instead
            // of a RegExp: `*`-expanded patterns backtrack, so one hostile entry
            // would stall the runner.
            const STAR = 1;
            const PLUS = 2;
            const WHITESPACE = new Set(
              ' \t\n\v\f\r\u00a0\u1680\u2000\u2001\u2002\u2003\u2004\u2005\u2006\u2007\u2008\u2009\u200a\u2028\u2029\u202f\u205f\u3000\ufeff'
            );

            function matchTokens(tokens, chars) {
              const length = chars.length;
              let next = new Uint8Array(length + 1);
              let current = new Uint8Array(length + 1);
              next[length] = 1;

              for (let i = tokens.length - 1; i >= 0; i -= 1) {
                current.fill(0);
                const token = tokens[i];

                if (token === STAR) {
                  current[length] = next[length];
                  for (let j = length - 1; j >= 0; j -= 1) current[j] = next[j] | current[j + 1];
                } else if (token === PLUS) {
                  for (let j = length - 1; j >= 0; j -= 1) {
                    current[j] = WHITESPACE.has(chars[j]) ? 0 : next[j + 1] | current[j + 1];
                  }
                } else {
                  for (let j = length - 1; j >= 0; j -= 1) current[j] = chars[j] === token ? next[j + 1] : 0;
                }

                const swap = next;
                next = current;
                current = swap;
              }

              return next[0] === 1;
            }

            function tokenize(rule) {
              return Array.from(rule, (character) => {
                if (character === '*') return STAR;
                if (character === '+') return PLUS;
                return character;
              });
            }

            function compileRule(rule) {
              const tokens = tokenize(rule.replace(/\*{2,}/g, '*'));
              const head = tokens[0] === STAR;
              const tail = tokens[tokens.length - 1] === STAR;
              const body = tokens.slice(head ? 1 : 0, tail ? -1 : tokens.length);

              if (body.length > 0 && body.every((token) => typeof token === 'string')) {
                const literal = body.join('');
                if (head && tail) return (value) => value.includes(literal);
                if (head) return (value) => value.endsWith(literal);
                if (tail) return (value) => value.startsWith(literal);
                return (value) => value === literal;
              }

              return (value) => matchTokens(tokens, Array.from(value));
            }

            function compileDictionary(text) {
              const rules = [];
              const literals = new Set();
              const matchers = [];

              for (const line of text.split('\n')) {
                const rule = line.trim().toLowerCase();
                if (!rule) continue;

                rules.push(rule);

                if (!/[*+]/.test(rule) && !rule.includes('&&')) {
                  literals.add(rule);
                  continue;
                }

                const parts = rule.split('&&').map((part) => part.trim()).filter(Boolean);
                if (parts.length === 0) continue;
                const compiled = parts.map(compileRule);
                matchers.push((value) => compiled.every((matcher) => matcher(value)));
              }

              const ruleMatchers = new Map();

              return {
                rules,
                matches(value) {
                  if (literals.has(value)) return true;
                  return matchers.some((matcher) => matcher(value));
                },
                // Compiles a single rule lazily; used to report the exact entry
                // that matched instead of a bare verdict.
                matchesRule(rule, value) {
                  if (!ruleMatchers.has(rule)) {
                    const parts = rule.split('&&').map((part) => part.trim()).filter(Boolean);
                    ruleMatchers.set(rule, parts.map(compileRule));
                  }
                  return ruleMatchers.get(rule).every((matcher) => matcher(value));
                },
              };
            }

            // --- validation -----------------------------------------------------
            const issue = context.payload.issue;
            const title = (issue.title || '').trim();
            const problems = [];

            if (title.length > MAX_TITLE_LENGTH) {
              problems.push(`- Title is ${title.length} characters long; the limit is ${MAX_TITLE_LENGTH}.`);
            }

            const match = title.length <= MAX_TITLE_LENGTH ? title.match(TITLE_RE) : null;
            const name = match ? match[1].trim() : '';

            if (!match && title.length <= MAX_TITLE_LENGTH) {
              problems.push(
                '- The title must be exactly `<HeroeName|Username>` or `<HeroeName|Username|#RRGGBB>`.'
              );
            }
            if (match && name.length > MAX_NAME_LENGTH) {
              problems.push(`- Username is ${name.length} characters long; the limit is ${MAX_NAME_LENGTH}.`);
            }

            const normalizedName = name.toLowerCase();

            const dictionaries = fs.existsSync(path.join(process.env.GITHUB_WORKSPACE, DICTIONARY_DIRECTORY))
              ? fs
                  .readdirSync(path.join(process.env.GITHUB_WORKSPACE, DICTIONARY_DIRECTORY))
                  .filter((file) => file.endsWith(DICTIONARY_EXTENSION))
                  .map((file) => ({
                    file,
                    dictionary: compileDictionary(
                      fs.readFileSync(
                        path.join(process.env.GITHUB_WORKSPACE, DICTIONARY_DIRECTORY, file),
                        'utf8'
                      )
                    ),
                  }))
              : [];

            let suspicious = null;
            if (normalizedName) {
              for (const entry of dictionaries) {
                const rule = entry.dictionary.rules.find((candidate) =>
                  entry.dictionary.matchesRule(candidate, normalizedName)
                );
                if (rule) {
                  suspicious = { file: entry.file, rule };
                  break;
                }
              }
            }

            const isValid = problems.length === 0;

            // --- labels ---------------------------------------------------------
            const existingLabels = new Set(
              (await github.paginate(github.rest.issues.listLabelsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              })).map((label) => label.name)
            );

            for (const label of LABELS) {
              if (existingLabels.has(label.name)) continue;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label.name,
                color: label.color,
                description: label.description,
              });
            }

            // A reopened or edited issue must not keep the opposite label.
            const applied = isValid ? 'Valid' : 'Invalid';
            const removed = isValid ? 'Invalid' : 'Valid';

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [applied],
            });

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: removed,
              });
            } catch (error) {
              // 404 simply means the issue never carried the other label.
              if (error.status !== 404) throw error;
            }

            if (!isValid) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `❌ **Validation failed.** Edit the issue to fix the following:\n\n${problems.join('\n')}`,
              });
              return;
            }

            let body = '✅ **Validation passed!** This submission will appear on the badge.';
            if (match && !match[2]) {
              body +=
                '\n\n💡 **Want a custom colour?** Edit the title to include one:\n' +
                `\`\`\`\n<HeroeName|${name}|#FF0000>\n\`\`\`\n` +
                'Any hex colour works (for example `#00FFAA`). Without it a colour is picked automatically.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });

            if (suspicious) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['Suspicious'],
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body:
                  '⚠️ **Suspicious:** the username matched a local dictionary entry.\n\n' +
                  `File: \`${DICTIONARY_DIRECTORY}/${suspicious.file}\`\n` +
                  `Rule: \`${suspicious.rule}\`\n\n` +
                  'This does not affect the validation result; it is logged for manual review.',
              });
            }

            // --- rotation -------------------------------------------------------
            // Each account keeps its two newest accepted submissions; older ones
            // are stopped so the badge stays a rotation rather than an archive.
            const author = issue.user.login;
            const submissions = (await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            }))
              .filter(
                (candidate) =>
                  candidate.user?.login === author &&
                  !candidate.pull_request &&
                  TITLE_RE.test((candidate.title || '').trim()) &&
                  (candidate.labels || []).some((label) => label.name === 'Valid')
              )
              .sort((left, right) => new Date(right.created_at) - new Date(left.created_at));

            for (const stale of submissions.slice(MAX_LABELLED_ISSUES)) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: stale.number,
                  name: 'Valid',
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: stale.number,
                labels: ['Stopped'],
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: stale.number,
                body: `⏹ This submission has been replaced by a newer one (#${issue.number}) and is no longer shown on the badge.`,
              });
            }
