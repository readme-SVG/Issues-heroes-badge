name: Llama Auto-Issue Generator

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, labeled]

permissions: read-all

concurrency:
  group: ai-issue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_code:
    name: Analyse change
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Secrets are not exposed to fork pull requests, and the script cannot do
    # anything useful without them, so those runs are skipped up front instead
    # of failing inside the analysis step.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir PyGithub==2.5.0 requests==2.32.3

      - name: Run AI analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          ALLOWED_USER: ${{ secrets.ALLOWED_USER }}
        run: python "trigger action/trigger_action.py"
