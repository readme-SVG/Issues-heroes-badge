name: Sync Banned Words (Suspicious Check)

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: sync-banned-words
  cancel-in-progress: false

jobs:
  sync:
    name: Sync dictionaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Fetch dictionaries from the upstream repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p _hard_banned

          # Only files that already live inside the directory are downloaded; the
          # listing comes from the API so renames upstream are picked up as-is.
          gh api \
            "repos/readme-SVG/Banned-words/contents/Hard-Banned-words-list" \
            --jq '.[] | select(.type == "file" and (.name | endswith(".txt"))) | .name' \
          | while IFS= read -r file; do
              gh api \
                "repos/readme-SVG/Banned-words/contents/Hard-Banned-words-list/${file}" \
                --jq '.content' | base64 -d > "_hard_banned/${file}"
            done

      - name: Replace local dictionaries
        run: |
          set -euo pipefail
          find banned-words -maxdepth 1 -name '*.txt' -delete
          cp _hard_banned/*.txt banned-words/

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- banned-words

          if git diff --cached --quiet; then
            echo "Dictionaries are already up to date."
            exit 0
          fi

          git commit -m "chore: sync banned-word dictionaries"
          git push origin HEAD
